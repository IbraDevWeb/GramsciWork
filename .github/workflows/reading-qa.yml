name: Reading UI smoke tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify pages in Chromium
        run: node qa/readability.mjs
      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-qa-screenshots
          path: qa-screenshots
